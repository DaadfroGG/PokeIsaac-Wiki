<div class="table-wrap"><table class="wikitable"{{ range $k, $v := .Attributes }} {{ printf "%s=%q" $k $v | safeHTMLAttr }}{{ end }}>
<thead>{{ range .THead }}<tr>{{ range . }}<th{{ with .Alignment }} class="{{ if eq . "right" }}num{{ else }}{{ . }}{{ end }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end }}</thead>
<tbody>{{ range .TBody }}<tr>{{ range . }}<td{{ with .Alignment }} class="{{ if eq . "right" }}num{{ else }}{{ . }}{{ end }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end }}</tbody>
</table></div>
