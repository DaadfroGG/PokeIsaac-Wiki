<!doctype html>
<html lang="{{ .Lang }}"><head><meta charset="utf-8"><title>{{ .Title }}</title>
{{- $to := printf "%s%s/%s" (partial "root.html" .) .Lang .Params.redirect }}
<meta name="robots" content="noindex"><link rel="canonical" href="{{ $to }}">
<noscript><meta http-equiv="refresh" content="0; url={{ $to }}"></noscript>
<script>location.replace({{ $to }} + location.hash);</script></head>
<body><p><a href="{{ $to }}">{{ .Title }}</a></p></body></html>
