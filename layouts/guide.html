{{ define "main" }}
<h1 class="title">{{ .Title }}<span class="sub">{{ T "guide_sub" }}</span></h1>
<div class="content guide"{{ with .Params.text_lang }} lang="{{ . }}"{{ end }}><p class="note">{{ T "guides_note" }}</p>
{{ .Content }}
<details class="navbox" open><summary data-hide="{{ T "hide" }}" data-show="{{ T "show" }}">{{ T "guides" }}</summary><table><tr><td>
{{- $here := . }}{{ range .Parent.RegularPages.ByWeight }}<a{{ if eq . $here }} class="self"{{ end }} href="{{ .RelPermalink }}">{{ .Title }}</a>
{{ end }}</td></tr></table></details></div>
{{ end }}
