pb_x_dmg: "Bonuses from all your items add up first, then diminishing returns shrink the total (full up to +3, half up to +8, a quarter up to +40). Multipliers from different items multiply each other, and the product is capped at ×3. Level and shiny come last."
pb_x_rate: "The delay between two shots goes down with each Fire rate bonus (diminishing returns after 3 points). Multipliers, level and shiny then change it. The game waits whole ticks between two shots, so the delay is rounded up, and it never goes faster than 12 shots per second."
pb_x_speed: "Item bonuses and conditional bonuses add to the base speed, then level and shiny multiply it. Speed never drops under 1.6."
pb_x_luck: "Luck counts in full up to 10. Above that, each point only counts for a quarter."
pb_x_dps: "Damage per shot = Damage × type bonuses × per-hit multipliers × the average critical hit factor. Then × shots per attack × attacks per second. Companions are added on top."
