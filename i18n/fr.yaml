pb_w_equipped: équipée
pb_w_equip: Équiper
pb_w_defdown: Défense réduite sur la cible (3 cumuls)
pb_w_assume: "Seule l'arme équipée est comptée. Estimation sur un seul ennemi qui reste à portée, chaque coup touche et vous gardez le bouton d'arme enfoncé. Les coups qui demandent plusieurs ennemis (rebonds, éclaboussures, liens) et les petits effets annexes des autres armes ne sont pas comptés."
pb_w_laser: "éclair ×0,7 sur la première cible, prêt après 1,5 × votre délai entre deux tirs"
pb_w_knife: "une morsure ×1,1 (équilibrage ×0,37) à moins de 60 px, prêt après 1,5 × votre délai (14 ticks minimum) ; les morsures en plus du tir multiple ne s'additionnent pas sur une cible ; Défense réduite augmente tous vos dégâts sur la cible"
pb_w_ring: "zones de blizzard ×0,78 toutes les 0,25 s pendant 5,3 s à pleine charge (équilibrage ×0,72) ; les zones des utilisations successives ne s'additionnent pas sur une même cible"
pb_w_epic: "séisme ×3,4 à pleine charge (équilibrage ×0,53), ennemis au sol seulement ; les anneaux du tir multiple font 12 % de moins chacun"
pb_w_beam: "Ultralaser après 16 coups (un par délai), 0,6 s de ×2,3 toutes les 0,05 s (équilibrage ×0,33), puis 0,57 s de repos"
pb_fx_weapon: Arme, utilisée avec sa propre touche
pb_w_fetus: "Voltorbes roulants : une salve, chacun effleure une fois (×0,45) puis explose sur la cible (×0,6), équilibrage ×0,8 ; prêt après 1,5 × 1,6 × votre délai"
sec_tips: Conseils
sub_tool: OUTIL
tips_tools: Outils
pb_w_module: module
pb_w_sword: "4 coups dont les dégâts montent de 15 % chacun puis une toupie ×1,6 avec ondes, équilibrage ×0,31 ; chaque coup attend 1,5 × votre délai (plus court dans le combo)"
pb_w_ludo: "une boule qui grossit en avançant (×0,68 à ×1,43, prise à mi-parcours), environ 1,5 coup par passage, équilibrage ×0,45 ; prêt après 1,5 × 1,8 × votre délai"
pb_w_lung: "pleine charge = une ligne de 7 rochers ×1,41, environ 2 sur la cible, équilibrage ×0,36 ; la charge suivante commence pendant le court repos"
pb_w_laser2: "lien vers l'ennemi marqué toutes les 0,2 s pour ×0,17 de vos dégâts (équilibrage ×0,62) ; fonctionne avec toute arme"
pb_w_charge: "remplace vos tirs normaux par des salves à pleine charge (balles ×1,25 plus 6 fragments à 15 % sur la cible), une par 2,5 × votre délai ; affiché comme la différence avec vos tirs normaux"
