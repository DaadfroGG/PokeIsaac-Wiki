pb_x_dmg: "Les bonus de tous vos objets s'additionnent d'abord, puis les rendements décroissants réduisent le total (plein jusqu'à +3, moitié jusqu'à +8, un quart jusqu'à +40). Les multiplicateurs d'objets différents se multiplient entre eux, et le produit est plafonné à ×3. Le niveau et la chromatique viennent en dernier."
pb_x_rate: "Le délai entre deux tirs diminue à chaque bonus de Cadence (rendements décroissants après 3 points). Les multiplicateurs, le niveau et la chromatique le modifient ensuite. Le jeu attend un nombre entier de ticks entre deux tirs, donc le délai est arrondi au tick supérieur, et il ne dépasse jamais 12 tirs par seconde."
pb_x_speed: "Les bonus d'objets et les bonus conditionnels s'ajoutent à la vitesse de base, puis le niveau et la chromatique la multiplient. La vitesse ne descend jamais sous 1,6."
pb_x_luck: "La Chance compte en entier jusqu'à 10. Au-delà, chaque point ne compte que pour un quart."
pb_x_dps: "Dégâts par tir = Dégâts × bonus de type × multiplicateurs par coup × facteur moyen de coup critique. Puis × tirs par attaque × attaques par seconde. Les compagnons s'ajoutent par-dessus."
